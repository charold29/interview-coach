name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Tests run in mock mode: no API key, no tokens spent.
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee build.log

      # Put compile errors and failing tests in the run summary, so the reason
      # is visible without opening the full log.
      - name: Report build errors
        if: failure()
        run: |
          errors=$(grep -E '^\[ERROR\]' build.log | grep -vE 'Re-run Maven|-> \[Help|^\[ERROR\] *$|To see the full stack|Help 1\]' | head -40 || true)
          if [ -n "$errors" ]; then
            echo "::error title=Maven build failed::$(printf '%s' "$errors" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          {
            echo '### Build errors'
            echo '```'
            printf '%s\n' "$errors"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Docker image
        run: docker build -t interview-coach .

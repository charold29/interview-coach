# --- Model -------------------------------------------------------------------
# The key is read from the environment. Never put a real key in this file.
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY:missing}
quarkus.langchain4j.anthropic.chat-model.model-name=${COACH_MODEL:claude-sonnet-5-5}
quarkus.langchain4j.anthropic.chat-model.max-tokens=2048
# Low temperature: scoring should be consistent between runs.
quarkus.langchain4j.anthropic.chat-model.temperature=0.2
quarkus.langchain4j.anthropic.timeout=60s

# --- Usage guard -------------------------------------------------------------
# Optional shared code friends must type before practicing. Empty = open.
coach.access-code=${COACH_ACCESS_CODE:}
# Max model calls per day for the whole instance (evaluations + rewrites).
coach.daily-limit=${COACH_DAILY_LIMIT:100}
# true = canned responses, no API calls. Useful for UI work and tests.
coach.mock=${COACH_MOCK:false}

# --- HTTP --------------------------------------------------------------------
# PaaS providers (Render, Fly.io, Railway) inject PORT.
quarkus.http.port=${PORT:8080}

# --- Tests -------------------------------------------------------------------
%test.coach.mock=true
%test.coach.access-code=
%test.coach.daily-limit=1000
